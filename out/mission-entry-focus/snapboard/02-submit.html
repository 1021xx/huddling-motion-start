<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>제출에 집중</title><style>
@font-face{font-family:Pretendard;src:url(assets/fonts/Pretendard-Regular.otf);font-weight:400}

.headline{margin:0;position:absolute;font-size:78.4px;line-height:95.2px;font-weight:700}
.body{margin:0;position:absolute;font-size:42px;line-height:67.2px;font-weight:400}

</style></head><body><main class="stage"><style>html,body{background:#edf1ff}</style><p class="eyebrow">결과물 제출</p><h1 class="headline" style="left:192px;top:250px;width:1536px;text-align:center">결과물과 적용 사례를<br>함께 제출해요.</h1><p class="body" style="left:192px;top:482px;width:1536px;text-align:center">파일과 활용 내용을 함께.</p><div class="scaled" style="left:470px;top:644px;transform:scale(2.8)"><style>
  @font-face { font-family: "Pretendard"; font-weight: 600; src: url("assets/fonts/Pretendard-SemiBold.otf") format("opentype"); }
  /* 토큰 (docs/design.md 1장) */
  :root {
    --color-primary: #3759de;
    --color-on-primary: #ffffff;
  }
  
  #button-submit {
    box-sizing: border-box;
    width: 350px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    overflow: hidden;
    border-radius: 8px;
    background: var(--color-primary);
  }
  #button-submit[data-state="apply-case"] { width: 318px; }
  /* Text/label */
  #button-submit .label {
    flex: 1 0 0;
    min-width: 1px;
    margin: 0;
    font-family: "Pretendard", sans-serif;
    font-weight: 600;
    font-size: 14px;
    line-height: 20px;
    color: var(--color-on-primary);
    text-align: center;
  }
  #button-submit .label > span { display: none; }
  #button-submit[data-state="submit"] [data-for="submit"],
  #button-submit[data-state="view-assets"] [data-for="view-assets"],
  #button-submit[data-state="add-asset"] [data-for="add-asset"],
  #button-submit[data-state="apply-case"] [data-for="apply-case"] { display: inline; }
</style>
  <div id="button-submit" data-state="submit">
    <p class="label"><span data-for="submit">제출하기</span><span data-for="view-assets">내 자산에서 보기</span><span data-for="add-asset">＋ 새 자산 등록</span><span data-for="apply-case">적용 사례 정리하기 →</span></p>
  </div>
  
</div></main></body></html>
