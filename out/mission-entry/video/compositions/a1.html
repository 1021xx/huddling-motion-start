function bezier(x1,y1,x2,y2) {
  const value=(a,b,t)=>3*(1-t)*(1-t)*t*a+3*(1-t)*t*t*b+t*t*t;
  return p=>{
    if(p<=0) return 0; if(p>=1) return 1;
    let lo=0,hi=1;
    for(let i=0;i<60;i++){let u=(lo+hi)/2;if(value(x1,x2,u)<p)lo=u;else hi=u;}
    return value(y1,y2,(lo+hi)/2);
  };
}
