<!doctype html>
<!--
  src/parts/stat-card.html — 이번 달 수익 카드 (Figma 195:636 · StatCard · 허들링 B안 공통 컴포넌트)
  크기: 350×81 (피그마 레이어 값 그대로, docs/design.md 4장). 위쪽 선 1px
  상태: 없음 (피그마에 variant 없음)
  숫자: #stat-card-amount span의 textContent만 바꾼다. ₩는 span 밖 (src/patterns/count-up.html)
    data-final = 최종값. tabular-nums 등 카운트업용 설정은 장면에서 더한다 (부품은 피그마 그대로)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>stat-card</title>
<style>
  @font-face { font-family: "Pretendard"; font-weight: 600; src: url("../assets/fonts/Pretendard-SemiBold.otf") format("opentype"); }
  @font-face { font-family: "Pretendard"; font-weight: 700; src: url("../assets/fonts/Pretendard-Bold.otf") format("opentype"); }
  /* 토큰 (docs/design.md 1장) */
  :root {
    --color-bg: #ffffff;
    --color-text: #18191b;
    --color-border: #e9eaed;
  }
  html, body { margin: 0; background: transparent; }
  #stat-card {
    box-sizing: border-box;
    width: 350px;
    padding-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
    border-top: 1px solid var(--color-border);
    background: var(--color-bg);
    color: var(--color-text);
    font-family: "Pretendard", sans-serif;
    white-space: pre-wrap;
  }
  #stat-card p { margin: 0; }
  /* Text/section */
  #stat-card .heading { font-weight: 700; font-size: 20px; line-height: 28px; }
  /* Text/label */
  #stat-card .counts { font-weight: 600; font-size: 14px; line-height: 20px; }
</style>
</head>
<body>
  <div id="stat-card">
    <p class="heading">이번 달 수익  ₩<span id="stat-card-amount" data-final="29,700">29,700</span></p>
    <p class="counts">전체 4개     /     검수 중 1개     /     판매 중 1개</p>
  </div>
</body>
</html>
