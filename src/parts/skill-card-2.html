<!doctype html>
<!--
  src/parts/skill-card-2.html — 스킬 카드 2 (Figma 195:632 · SkillCard · 허들링 B안 공통 컴포넌트)
  크기: 350×48 (피그마 레이어 값 그대로, docs/design.md 4장)
  일러스트: src/assets/buddy-front-2.png (Character / buddy-front, 스카프 펭귄). 감싸기만 하고 고치지 않는다
  상태: 없음 (피그마에 variant 없음)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>skill-card-2</title>
<style>
  @font-face { font-family: "Pretendard"; font-weight: 400; src: url("../assets/fonts/Pretendard-Regular.otf") format("opentype"); }
  @font-face { font-family: "Pretendard"; font-weight: 600; src: url("../assets/fonts/Pretendard-SemiBold.otf") format("opentype"); }
  /* 토큰 (docs/design.md 1장) */
  :root {
    --color-bg: #ffffff;
    --color-text: #18191b;
    --color-text-muted: #75777c;
    --color-character-bg: #e3f2fd;
  }
  html, body { margin: 0; background: transparent; }
  .skill-card {
    width: 350px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    overflow: hidden;
    background: var(--color-bg);
    font-family: "Pretendard", sans-serif;
  }
  .skill-card .character {
    flex: none;
    width: 72px;
    height: 48px;
    overflow: hidden;
    background: var(--color-character-bg);
  }
  .skill-card .character img { display: block; width: 72px; height: 48px; object-fit: contain; }
  .skill-card .copy { width: 266px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .skill-card p { margin: 0; }
  /* Text/list-title */
  .skill-card .title { font-weight: 600; font-size: 15px; line-height: 22px; color: var(--color-text); }
  /* Text/caption */
  .skill-card .meta { font-weight: 400; font-size: 12px; line-height: 16px; color: var(--color-text-muted); }
</style>
</head>
<body>
  <div id="skill-card-2" class="skill-card">
    <div class="character"><img src="../assets/buddy-front-2.png" alt=""></div>
    <div class="copy">
      <p class="title">자료를 비교표로 정리하기</p>
      <p class="meta">리서치 · 초급 · Claude · 무료</p>
    </div>
  </div>
</body>
</html>
