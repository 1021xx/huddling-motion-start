<!doctype html>
<!--
  src/parts/mission-card.html — 이번 달 미션 카드 (Figma 195:642 · MissionCard · 허들링 B안 공통 컴포넌트)
  크기: 350×253 (피그마 레이어 값 그대로). 안쪽 여백 16 (space-content) · 간격 12 (space-small) · 안쪽 묶음 간격 8 (space-inline) · 모서리 12 (radius-card) · 테두리 1px. 토큰 이름은 docs/design.md 4장 Scale
  일러스트: src/assets/perdi-flag.png (Character / perdi-flag, 깃발 든 펭귄). 감싸기만 하고 고치지 않는다
  상태: 없음 (피그마에 variant 없음)
  진행 바: 피그마는 벡터 2개(트랙 318×3 + 채움 159×3)인데, 차오르는 모션을 위해 div 2개로 옮겼다. 색 · 크기는 같다
    #mission-card-progress-fill 의 --progress (0–1)만 바꾼다. 기본 0.5 = 피그마 값
    진행 글자 #mission-card-progress-text 는 같은 emphasis로 함께 오른다 (docs/motion.md 2장)
  버튼: button-submit의 apply-case 상태와 같은 모양 (src/parts/button-submit.html)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mission-card</title>
<style>
  @font-face { font-family: "Pretendard"; font-weight: 400; src: url("../assets/fonts/Pretendard-Regular.otf") format("opentype"); }
  @font-face { font-family: "Pretendard"; font-weight: 600; src: url("../assets/fonts/Pretendard-SemiBold.otf") format("opentype"); }
  @font-face { font-family: "Pretendard"; font-weight: 700; src: url("../assets/fonts/Pretendard-Bold.otf") format("opentype"); }
  /* 토큰 (docs/design.md 1장) */
  :root {
    --color-bg: #ffffff;
    --color-text: #18191b;
    --color-text-muted: #75777c;
    --color-primary: #3759de;
    --color-on-primary: #ffffff;
    --color-character-bg: #e3f2fd;
    --color-illustration-dce2f2: #dce2f2;
    --color-illustration-ebeef5: #ebeef5;
  }
  html, body { margin: 0; background: transparent; }
  #mission-card {
    box-sizing: border-box;
    width: 350px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
    border: 1px solid var(--color-illustration-dce2f2);
    border-radius: 12px;
    background: var(--color-bg);
    font-family: "Pretendard", sans-serif;
  }
  #mission-card p { margin: 0; }
  #mission-card .cover { width: 318px; display: flex; align-items: flex-start; gap: 12px; overflow: hidden; }
  #mission-card .copy { width: 218px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  /* Text/caption */
  #mission-card .caption { font-weight: 400; font-size: 12px; line-height: 16px; white-space: pre-wrap; }
  #mission-card .eyebrow { color: var(--color-primary); }
  /* Text/compact-title */
  #mission-card .title { font-weight: 700; font-size: 22px; line-height: 28px; color: var(--color-text); }
  #mission-card .character {
    flex: none;
    width: 88px;
    height: 96px;
    overflow: hidden;
    background: var(--color-character-bg);
  }
  #mission-card .character img { display: block; width: 88px; height: 96px; object-fit: contain; }
  #mission-card .deliverables { width: 318px; color: var(--color-text-muted); }
  #mission-card .progress { width: 318px; display: flex; flex-direction: column; gap: 8px; }
  #mission-card .progress-labels { display: flex; }
  #mission-card #mission-card-progress-text { width: 190px; color: var(--color-primary); }
  #mission-card .due { width: 128px; color: var(--color-text-muted); text-align: right; }
  #mission-card .track {
    position: relative;
    width: 318px;
    height: 3px;
    overflow: hidden;
    border-radius: 1.5px;
    background: var(--color-illustration-ebeef5);
  }
  #mission-card-progress-fill {
    --progress: 0.5;
    position: absolute;
    left: 0;
    top: 0;
    width: calc(318px * var(--progress));
    height: 3px;
    border-radius: 1.5px;
    background: var(--color-primary);
  }
  #mission-card .button {
    box-sizing: border-box;
    width: 318px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 8px;
    background: var(--color-primary);
  }
  /* Text/label */
  #mission-card .button p {
    flex: 1 0 0;
    font-weight: 600;
    font-size: 14px;
    line-height: 20px;
    color: var(--color-on-primary);
    text-align: center;
  }
</style>
</head>
<body>
  <div id="mission-card">
    <div class="cover">
      <div class="copy">
        <p class="caption eyebrow">이번 달 미션  ·  D–12</p>
        <p class="title">반복 업무를 줄이는<br>AI 자동화</p>
      </div>
      <div class="character"><img src="../assets/perdi-flag.png" alt=""></div>
    </div>
    <p class="caption deliverables">자동화 자산 1개 + 실제 적용 사례 1개</p>
    <div class="progress">
      <div class="progress-labels">
        <p id="mission-card-progress-text" class="caption">50% · 2/4 단계 완료</p>
        <p class="caption due">9월 30일 마감</p>
      </div>
      <div class="track"><div id="mission-card-progress-fill"></div></div>
    </div>
    <div id="mission-card-button" class="button"><p>적용 사례 정리하기 →</p></div>
  </div>
</body>
</html>
