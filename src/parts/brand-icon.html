<!doctype html>
<!--
  src/parts/brand-icon.html — 앱 아이콘 (Figma 255:2700)
  크기: 98×98 (피그마 레이어 값 그대로, docs/design.md 4장). 안에 흰 심볼 66×66
  원본: src/assets/logo-symbol-white.svg (logo의 symbol-white와 같은 파일). 감싸기만 하고 고치지 않는다
  상태: 없음 (피그마에 variant 없음)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>brand-icon</title>
<style>
  /* 토큰 (docs/design.md 1장) */
  :root {
    --color-illustration-000000: #000000;
  }
  html, body { margin: 0; background: transparent; }
  #brand-icon {
    box-sizing: border-box;
    width: 98px;
    padding: 16px;
    display: flex;
    align-items: center;
    border-radius: 12px;
    background: var(--color-illustration-000000);
  }
  #brand-icon img { display: block; flex: none; width: 66px; height: 66px; }
</style>
</head>
<body>
  <div id="brand-icon">
    <img src="../assets/logo-symbol-white.svg" width="100" height="100" alt="Huddling Club">
  </div>
</body>
</html>
